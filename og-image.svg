  <text x="90" y="415" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" font-weight="500" fill="#1A1A1A" letter-spacing="1">I BUILD SYSTEMS THAT RUN BUSINESSES.</text>

  <!-- Magenta line -->
