  <!-- URL -->
  <text x="80" y="540" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="14" font-weight="400" fill="#777" letter-spacing="2">AQNIYET.COM</text>

  <!-- Location -->
  <text x="80" y="570" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" font-weight="400" fill="#555" letter-spacing="2">ALMATY, KAZAKHSTAN</text>
