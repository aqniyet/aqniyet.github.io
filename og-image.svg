<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1A1A1A"/>

  <!-- Yellow top bar -->
  <rect width="1200" height="6" fill="#DFFF00"/>

  <!-- Blue accent block left -->
  <rect x="0" y="0" width="6" height="630" fill="#0055FF"/>

  <!-- Magenta bottom bar -->
  <rect y="624" width="1200" height="6" fill="#FF006E"/>

  <!-- Name -->
  <text x="80" y="260" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-size="82" font-weight="700" fill="#FFFDF5" letter-spacing="-3">AKNIYET</text>
  <text x="80" y="350" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-size="82" font-weight="700" fill="#FFFDF5" letter-spacing="-3">TULAKBAYEV</text>

  <!-- Blue shadow offset on name (brutalist) -->
  <text x="84" y="264" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-size="82" font-weight="700" fill="#0055FF" letter-spacing="-3" opacity="0.3">AKNIYET</text>
  <text x="84" y="354" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-size="82" font-weight="700" fill="#0055FF" letter-spacing="-3" opacity="0.3">TULAKBAYEV</text>

